apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-chat-frontend
spec:
  ingressClassName: traefik
  rules:
    - host: chat-qa.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n-chat-frontend
                port:
                  number: 80
    - host: chat-qa.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n-chat-frontend
                port:
                  number: 80
