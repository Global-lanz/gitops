apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-chat-backend
spec:
  ingressClassName: traefik
  rules:
    - host: api.chat-dev.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n-chat-backend
                port:
                  number: 3000
