apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-n8n-config
data:
  # --- Backend ---
  PORT: "3000"
  NODE_ENV: production
  APP_ENVIRONMENT: dev
  BOT_NAME: NorteIA
  AUTH_MODE: external
  MODULE_KEY: chat
  # In-cluster URL of the central auth service (same namespace)
  AUTH_BASE_URL: http://blueprint-auth:3400
  AUTH_PORTAL_URL: http://auth.blueprint-dev.local
  ALLOWED_ORIGINS: http://chat-dev.local,http://chat-dev.127.0.0.1.nip.io
  N8N_WEBHOOK_URL: https://n8n-dev.local/webhook/chat
  N8N_EMAIL_WEBHOOK_URL: https://n8n-dev.local/webhook/welcome-email
  # --- Frontend (read at container start -> env-config.js) ---
  API_BASE_URL: http://api.chat-dev.local
