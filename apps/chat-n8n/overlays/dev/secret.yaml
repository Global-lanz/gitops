apiVersion: v1
kind: Secret
metadata:
  name: chat-n8n-secret
type: Opaque
stringData:
  DATABASE_URL: postgresql://app:apppass@postgres-dev-postgresql:5432/chatdb
  # MUST match blueprint-auth's AUTH_JWT_SECRET (validates the central JWT).
  AUTH_JWT_SECRET: dev-shared-jwt-secret-change-me
  # Only used as a fallback in internal auth mode; harmless in external mode.
  JWT_SECRET: dev-chat-jwt-secret-change-me
