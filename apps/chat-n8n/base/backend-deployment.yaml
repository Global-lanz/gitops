apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-chat-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n-chat-backend
  template:
    metadata:
      labels:
        app: n8n-chat-backend
    spec:
      containers:
        - name: n8n-chat-backend
          image: maiconlanzendorf/n8n-chat-backend:1.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: chat-n8n-config
            - secretRef:
                name: chat-n8n-secret
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
