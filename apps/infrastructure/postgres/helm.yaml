apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: postgres
  namespace: argocd
spec:
  generators:
    # Active environments come from gitops/envs/*.yaml — add/remove a file there
    # to enable/disable an env across ALL apps at once.
    - git:
        repoURL: https://github.com/Global-lanz/gitops.git
        revision: main
        files:
          - path: "envs/*.yaml"
  template:
    metadata:
      name: postgres-{{env}}
    spec:
      project: default
      source:
        repoURL: https://charts.bitnami.com/bitnami
        chart: postgresql
        targetRevision: 15.x
        helm:
          parameters:
            - name: auth.username
              value: app
            - name: auth.password
              value: apppass
            - name: auth.database
              value: "{{database}}"
            - name: image.registry
              value: docker.io
            - name: image.repository
              value: bitnami/postgresql
            - name: image.tag
              value: latest
            - name: primary.replicaCount
              value: "{{postgresReplicas}}"
            - name: primary.persistence.size
              value: 8Gi
          # Create a dedicated database per app on the same server (each app has
          # its own schema, e.g. all define a `User` table, so they can't share
          # `appdb`). Runs only on FIRST init (empty data dir); for an already
          # initialized volume create them manually — see README/notes.
          values: |
            primary:
              initdb:
                scripts:
                  01-extra-databases.sql: |
                    CREATE DATABASE blueprint_auth OWNER app;
                    CREATE DATABASE chatdb OWNER app;
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true