apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kafka
  namespace: argocd
spec:
  generators:
    # Active environments come from gitops/envs/*.yaml — add/remove a file there
    # to enable/disable an env across ALL apps at once.
    - git:
        repoURL: https://github.com/Global-lanz/gitops.git
        revision: main
        files:
          - path: "envs/*.yaml"
  template:
    metadata:
      name: kafka-{{env}}
    spec:
      project: default
      source:
        repoURL: https://charts.bitnami.com/bitnami
        chart: kafka
        targetRevision: 28.x
        helm:
          values: |
            replicaCount: {{kafkaReplicas}}
            zookeeper:
              enabled: true
            persistence:
              size: 8Gi
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true