apiVersion: apps/v1
kind: Deployment
metadata:
  name: blueprint-auth-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blueprint-auth-frontend
  template:
    metadata:
      labels:
        app: blueprint-auth-frontend
    spec:
      containers:
        - name: blueprint-auth-frontend
          image: maiconlanzendorf/blueprint-auth-frontend:0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            # nginx proxies /api -> the in-cluster blueprint-auth service (:3400)
            - name: API_BASE_URL
              value: /api
            # Base URL of the Blueprint app deployment, used to redirect
            # PROJECT_TEMPLATE modules to /m/{moduleKey} (BLUEPRINT-12)
            - name: BLUEPRINT_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: blueprint-auth-config
                  key: BLUEPRINT_APP_URL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
