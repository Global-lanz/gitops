apiVersion: v1
kind: ConfigMap
metadata:
  name: blueprint-auth-config
data:
  PORT: "3400"
  NODE_ENV: production
  JWT_ACCESS_TTL: "1h"
  JWT_REFRESH_TTL: "30d"
  FRONTEND_URL: http://auth.blueprint-qa.ionflux.cloud
  SEED_ADMIN_EMAIL: admin@blueprint-auth.local
  SEED_ADMIN_NAME: Auth Admin
  SEED_MODULES: "guia:GuIA:365,blueprint:BluePrint:365"
  SEED_MODULE_URLS: "guia:http://guia-qa.ionflux.cloud,blueprint:http://blueprint-qa.ionflux.cloud"
  SEED_MODULE_ICONS: "guia:💬,blueprint:📐"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_FROM: "Auth <no-reply@blueprint-auth.local>"
  BLUEPRINT_APP_URL: http://blueprint-qa.ionflux.cloud
  # Origem permitida no CORS (nunca "*"). O navegador fala com a API pelo nginx do
  # portal (mesma origem), entao so a propria origem do portal precisa constar.
  CORS_ORIGIN: http://auth.blueprint-qa.ionflux.cloud
  # Proxies cujo X-Forwarded-For o Express do auth aceita (nginx do portal e, atras dele, o
  # Traefik: pods da rede de pods do k3s, padrao 10.42.0.0/16; o no usa 10.42.1.0/24). Sem isto
  # req.ip e sempre o pod do nginx e os limites por IP viram um balde unico (N1 da revisao).
  # So devolve o IP real depois do HelmChartConfig do Traefik (docs/devops/traefik-ip-real.md);
  # ate la o IP resultante continua sendo 10.42.1.1, e o codigo deve ignorar IP privado.
  TRUST_PROXY_CIDRS: "10.42.0.0/16"
