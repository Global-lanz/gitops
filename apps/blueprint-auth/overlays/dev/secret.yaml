apiVersion: v1
kind: Secret
metadata:
  name: blueprint-auth-secret
type: Opaque
stringData:
  DATABASE_URL: postgresql://app:apppass@postgres-dev-postgresql:5432/blueprint_auth
  # AUTH_JWT_SECRET MUST be identical in every resource server that validates
  # these tokens (blueprint-backend, chat-n8n in external mode).
  AUTH_JWT_SECRET: dev-shared-jwt-secret-change-me
  WEBHOOK_SECRET_TOKEN: dev-webhook-token-change-me
  SEED_ADMIN_PASSWORD: admin123
  SMTP_USER: ""
  SMTP_PASSWORD: ""
