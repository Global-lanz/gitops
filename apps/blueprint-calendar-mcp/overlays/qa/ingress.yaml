# O Bearer bpc_ trafega neste host. O TLS termina no Traefik do Docker da VPS
# (qa-routes.yaml, certResolver mytlschallenge), que repassa em HTTP para a porta 80
# do Traefik do k3s; por isso este Ingress usa so o entrypoint padrao, sem tls.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blueprint-calendar-mcp
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: qa-blueprint-calendar-mcp-ratelimit@kubernetescrd,qa-blueprint-calendar-mcp-bodylimit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: mcp.calendario-qa.ionflux.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blueprint-calendar-mcp
                port:
                  number: 3600
