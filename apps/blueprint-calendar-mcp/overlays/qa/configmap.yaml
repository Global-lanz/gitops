apiVersion: v1
kind: ConfigMap
metadata:
  name: blueprint-calendar-mcp-config
data:
  NODE_ENV: production
  PORT: "3600"
  # Fixo; o MCP nunca aceita URL vinda de ferramenta. Inclui o prefixo global /api do
  # backend (src/config.ts exige http(s), sem credencial/query).
  CALENDAR_API_URL: http://blueprint-calendar-backend:3500/api
  # Obrigatorio em producao (sem ele o processo nao sobe). Sem porta = aceita qualquer porta.
  # O Traefik repassa o Host original, entao e o host publico. /health ignora essa checagem.
  MCP_ALLOWED_HOSTS: calendario-mcp-qa.ionflux.cloud
  # Origens de navegador permitidas. Omitido de proposito: vazio = qualquer requisicao COM
  # cabecalho Origin recebe 403 (seguro). Claude Code/Desktop nao enviam Origin. So preencher
  # se um inspetor MCP hospedado for usado.
  # MCP_ALLOWED_ORIGINS: ""
  LOG_LEVEL: info
  # Padrao do codigo e 10000 (faixa 500-60000).
  BACKEND_TIMEOUT_MS: "10000"
  # Limita o heap do Node abaixo do limit de 128Mi do container, para o GC agir antes do OOMKill.
  NODE_OPTIONS: --max-old-space-size=80
