apiVersion: apps/v1
kind: Deployment
metadata:
  name: blueprint-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blueprint-frontend
  template:
    metadata:
      labels:
        app: blueprint-frontend
    spec:
      containers:
        - name: blueprint-frontend
          image: maiconlanzendorf/blueprint-frontend:1.3.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: blueprint-config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20