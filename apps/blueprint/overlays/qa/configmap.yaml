apiVersion: v1
kind: ConfigMap
metadata:
  name: blueprint-config
data:
  PORT: "3333"
  # Relative base: the frontend's nginx proxies /api/ -> blueprint-backend:3333
  # (backend has global prefix `api`). Same-origin, scheme-agnostic, no CORS.
  API_URL: /api
  BACKEND_URL: http://blueprint-backend:3333
  FRONTEND_URL: http://blueprint-qa.ionflux.cloud
  # Central auth portal — used for login redirect and the /logout (SSO) handoff.
  AUTH_PORTAL_URL: http://auth.blueprint-qa.ionflux.cloud
  S3_ENDPOINT: http://minio.tools.svc.cluster.local:9000
  S3_BUCKET: blueprint
  S3_PUBLIC_URL: http://minio.tools.svc.cluster.local:9000
  S3_REGION: us-east-1
  S3_PUBLIC_ENDPOINT: http://minio.tools.svc.cluster.local:9000
  SMTP_HOST: smtp-qa.local
  SMTP_PORT: "587"
  SMTP_FROM: blueprint-qa@local.dev