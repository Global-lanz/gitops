apiVersion: v1
kind: ConfigMap
metadata:
  name: blueprint-config
data:
  PORT: "3333"
  # Relative base: the frontend's nginx proxies /api/ -> blueprint-backend:3333
  # (backend has global prefix `api`). Same-origin, scheme-agnostic, no CORS.
  API_URL: /api
  BACKEND_URL: http://blueprint-backend:3333
  FRONTEND_URL: https://blueprint.ionflux.cloud
  # Central auth portal — used for login redirect and the /logout (SSO) handoff.
  AUTH_PORTAL_URL: https://auth.blueprint.ionflux.cloud
  S3_ENDPOINT: http://minio.tools.svc.cluster.local:9000
  S3_BUCKET: blueprint
  S3_PUBLIC_URL: http://minio.tools.svc.cluster.local:9000
  S3_REGION: us-east-1
  S3_PUBLIC_ENDPOINT: http://minio.tools.svc.cluster.local:9000
  SMTP_HOST: smtp-prod.local
  SMTP_PORT: "587"
  SMTP_FROM: blueprint@local.dev
  MODULE_KEY: blueprint
  # --- Chat Embed Widget (calls guia's embed-SSO endpoint server-to-server) ---
  # Internal cluster DNS — guia-backend runs in this same prod namespace.
  CHAT_EMBED_BASE_URL: http://guia-backend:3000
  # Public origin of guia's frontend, used by the widget to build the iframe src.
  CHAT_WIDGET_URL: https://guia.ionflux.cloud
  # Origem permitida no CORS (nunca "*"). O frontend usa /api na mesma origem; so a
  # propria origem do frontend precisa constar.
  CORS_ORIGIN: https://blueprint.ionflux.cloud
