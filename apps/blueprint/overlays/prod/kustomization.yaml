namespace: prod
resources:
  - ../../base
  - configmap.yaml
  - secret.enc.yaml
  - ingress.yaml
  - backend-ingress.yaml
# Pin da versão promovida pro prod. dev acompanha o base direto (sempre mais
# novo); qa/prod só avançam quando alguém trocar a tag aqui manualmente,
# depois de testar em ambientes mais baixos.
# images:
#   - name: maiconlanzendorf/blueprint-backend
#     newTag: "1.4.0"
#   - name: maiconlanzendorf/blueprint-frontend
#     newTag: "1.3.2"

# A NetworkPolicy do postgres-prod exige este label de quem conecta
# (allowExternal: false no HelmRelease de envs-overlays/prod). Sem ele o
# backend sobe e cai no `prisma db push` do entrypoint com P1001 (banco
# inalcancavel). So o backend leva o label: o frontend e nginx e nao fala com
# o Postgres.
patches:
  - target:
      kind: Deployment
      name: blueprint-backend
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/postgres-prod-postgresql-client
        value: "true"
