apiVersion: v1
kind: ConfigMap
metadata:
  name: norteia-config
data:
  # --- Backend ---
  PORT: "3000"
  NODE_ENV: production
  APP_ENVIRONMENT: dev
  BOT_NAME: NorteIA
  AUTH_MODE: internal
  ALLOWED_ORIGINS: http://norteia-dev.ionflux.cloud
  N8N_WEBHOOK_URL: https://n8n-dev.ionflux.cloud/webhook/chat
  N8N_EMAIL_WEBHOOK_URL: https://n8n-dev.ionflux.cloud/webhook/welcome-email
  INITIAL_ADMIN_EMAIL: admin@norteia-dev.ionflux.cloud
  INITIAL_ADMIN_USERNAME: admin
  # --- Frontend (read at container start -> env-config.js) ---
  API_BASE_URL: http://api.norteia-dev.ionflux.cloud
