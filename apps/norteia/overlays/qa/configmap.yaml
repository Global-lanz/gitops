apiVersion: v1
kind: ConfigMap
metadata:
  name: norteia-config
data:
  # --- Backend ---
  PORT: "3000"
  NODE_ENV: production
  APP_ENVIRONMENT: qa
  BOT_NAME: NorteIA
  AUTH_MODE: internal
  ALLOWED_ORIGINS: https://norteia-qa.ionflux.cloud
  N8N_WEBHOOK_URL: https://n8n.ionflux.cloud/webhook/chat
  N8N_EMAIL_WEBHOOK_URL: https://n8n.ionflux.cloud/webhook/welcome-email
  INITIAL_ADMIN_EMAIL: admin@norteia-qa.ionflux.cloud
  INITIAL_ADMIN_USERNAME: admin
  # --- Frontend (read at container start -> env-config.js) ---
  API_BASE_URL: https://api.norteia-qa.ionflux.cloud
  # --- Embed SSO (meudua embeds norteia's chat via iframe) ---
  # Requires the n8n-chat-backend/frontend images to include the embed-SSO
  # feature (unreleased as of 1.4.0 - still a pending changeset). Bump the
  # image tags below once that version is published, or these are inert.
  EMBED_ALLOWED_ORIGIN: https://estudio-dua-staging.vercel.app
  EMBED_FALLBACK_URL: https://estudio-dua-staging.vercel.app
