apiVersion: apps/v1
kind: Deployment
metadata:
  name: astra-api
spec:
  replicas: 1
  # 1 replica e obrigatoria enquanto o chat de evento usar o broker STOMP em
  # memoria (ADR-0007): duas usuarias em pods diferentes nao se veriam.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: astra-api
  template:
    metadata:
      labels:
        app: astra-api
    spec:
      securityContext:
        runAsNonRoot: true
        # O UID precisa ser NUMERICO aqui. Sem isto, com `USER astra` na imagem, o
        # kubelet nao consegue verificar que o usuario nao e root e o pod fica em
        # CreateContainerConfigError. 100/101 sao os ids fixados no Dockerfile.
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: astra-api
          image: maiconlanzendorf/astra-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: astra-config
            - secretRef:
                name: astra-secret
          resources:
            # VPS de 1 vCPU / 4 GB dividido com a stack Docker Compose. A JVM esta
            # ajustada no Dockerfile (SerialGC, MaxRAMPercentage=70, Xss512k) para
            # caber aqui. Se o pod for morto por OOM, suba o limite antes de mexer
            # no codigo — 512Mi e o piso realista para Spring Boot com JPA.
            #
            # 640Mi desde o ADR-0017: o pod de qa caiu em 05/10 com
            # "OutOfMemoryError: Metaspace" (teto de 128m), e a marca d'agua carrega
            # Java2D/ImageIO, mais classes ainda. O Dockerfile sobe o metaspace para
            # 192m e baixa o MaxRAMPercentage para 55 -- o heap fica no mesmo tamanho
            # de antes (~350Mi). O /tmp em memoria (abaixo) tambem conta neste limite.
            # Este limite pode ir para a main ANTES da imagem nova (a antiga cabe);
            # a imagem nova com o limite antigo de 512Mi teria heap menor que hoje.
            requests:
              cpu: 100m
              memory: 448Mi
            limits:
              cpu: 750m
              memory: 640Mi
          startupProbe:
            # Spring Boot leva ~20-40s para subir num vCPU compartilhado. Sem esta
            # probe o liveness mata o pod antes de ele terminar de iniciar.
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Unica escrita da API: pastas do Tomcat, o arquivo temporario do
            # Font.createFont (marca d'agua) e o cache do fontconfig.
            - name: tmp
              mountPath: /tmp
      volumes:
        # Em memoria (tmpfs), nao no disco do no (ADR-0017; docs/15 5.1 e 5.8): se um
        # upload de documento cair em arquivo temporario, ele some com o pod em vez de
        # ficar no disco do VPS. O uso conta no limite de memoria do container; hoje
        # sao ~100KB. sizeLimit estourado = pod despejado, nunca disco cheio.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
