apiVersion: apps/v1
kind: Deployment
metadata:
  name: blueprint-calendar-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blueprint-calendar-backend
  template:
    metadata:
      labels:
        app: blueprint-calendar-backend
    spec:
      containers:
        - name: blueprint-calendar-backend
          image: maiconlanzendorf/blueprint-calendar-backend:1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3500
          envFrom:
            - configMapRef:
                name: blueprint-calendar-config
            - secretRef:
                name: blueprint-calendar-secret
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 320Mi
          # httpGet em vez do tcpSocket usado pelo blueprint: o app expoe
          # GET /api/health, que nao toca no banco (so devolve status/versao),
          # entao a liveness nao reinicia o pod por causa de oscilacao do Postgres.
          # Os tempos sao os mesmos do blueprint; o `prisma db push` do
          # entrypoint roda antes de a porta abrir e cabe nessa janela.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3500
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3500
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
