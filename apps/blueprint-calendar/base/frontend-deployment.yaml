apiVersion: apps/v1
kind: Deployment
metadata:
  name: blueprint-calendar-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blueprint-calendar-frontend
  template:
    metadata:
      labels:
        app: blueprint-calendar-frontend
    spec:
      containers:
        - name: blueprint-calendar-frontend
          image: maiconlanzendorf/blueprint-calendar-frontend:1.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: blueprint-calendar-config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
