namespace: qa
resources:
  - ../../base
  - configmap.yaml
  - secret.enc.yaml
  - ingress.yaml
  - backend-ingress.yaml
# Pin da versão promovida pro QA. dev acompanha o base direto (sempre mais
# novo); qa/prod só avançam quando alguém trocar a tag aqui manualmente,
# depois de testar em ambientes mais baixos. Escopado só ao guia — não afeta
# outros apps que usem a mesma imagem base (ex: norteia).
images:
  - name: maiconlanzendorf/n8n-chat-backend
    newTag: "RC.20260810.001"
  - name: maiconlanzendorf/n8n-chat-frontend
    newTag: "RC.20260809.001"
