namespace: prod
resources:
  - ../../base
  - configmap.yaml
  - secret.enc.yaml
  - ingress.yaml
  - backend-ingress.yaml
# Pin da versão promovida pro prod. Fica intencionalmente atrás do base (que
# já subiu pra 1.4.0 pro dev) até ser testada em qa e promovida aqui
# manualmente. Escopado só ao guia — não afeta outros apps que usem a mesma
# imagem base (ex: norteia).
images:
  - name: maiconlanzendorf/n8n-chat-backend
    newTag: "1.4.0"
  - name: maiconlanzendorf/n8n-chat-frontend
    newTag: "1.4.0"

# A NetworkPolicy do postgres-prod exige este label de quem conecta
# (allowExternal: false no HelmRelease de envs-overlays/prod). Sem ele o
# backend sobe e cai no `prisma db push` do entrypoint com P1001 (banco
# inalcancavel). So o backend leva o label: o frontend e nginx e nao fala com
# o Postgres.
patches:
  - target:
      kind: Deployment
      name: guia-backend
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/postgres-prod-postgresql-client
        value: "true"
