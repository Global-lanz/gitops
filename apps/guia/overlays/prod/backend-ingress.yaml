apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guia-backend
spec:
  ingressClassName: traefik
  rules:
    - host: api.guia.ionflux.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: guia-backend
                port:
                  number: 3000
