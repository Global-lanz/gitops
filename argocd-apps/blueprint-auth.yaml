apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: blueprint-auth
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            namespace: dev
          - env: qa
            namespace: qa
          - env: prod
            namespace: prod
  template:
    metadata:
      name: blueprint-auth-{{env}}
    spec:
      project: default
      source:
        repoURL: https://github.com/Global-lanz/gitops.git
        targetRevision: main
        path: apps/blueprint-auth/overlays/{{env}}
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
