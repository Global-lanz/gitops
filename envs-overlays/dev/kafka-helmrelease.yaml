apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kafka-dev
  namespace: dev
spec:
  interval: 5m
  chart:
    spec:
      chart: kafka
      version: "28.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    kraft:
      enabled: false
    zookeeper:
      enabled: true
    controller:
      replicaCount: 0
    broker:
      replicaCount: 1
    persistence:
      size: 8Gi
