apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-dev
  namespace: dev
spec:
  interval: 5m
  chart:
    spec:
      chart: postgresql
      version: "15.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    auth:
      username: app
      password: apppass
      database: blueprint-dev
    image:
      registry: docker.io
      repository: bitnami/postgresql
      tag: latest
    primary:
      replicaCount: 1
      persistence:
        size: 8Gi
      # Create a dedicated database per app on the same server (each app has its
      # own schema, e.g. all define a `User` table, so they can't share one DB).
      # Runs only on FIRST init (empty data dir); see NOTES.md for an already
      # initialized volume.
      initdb:
        scripts:
          01-extra-databases.sql: |
            CREATE DATABASE blueprint_auth OWNER app;
            CREATE DATABASE norteiadb OWNER app;
            CREATE DATABASE guiadb OWNER app;
            CREATE DATABASE n8ndb OWNER app;
