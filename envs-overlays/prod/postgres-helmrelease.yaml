apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-prod
  namespace: prod
spec:
  interval: 5m
  chart:
    spec:
      chart: postgresql
      version: "15.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    auth:
      username: app
      database: blueprint
      # A senha saiu daqui. Este repositorio e PUBLICO, e o valor anterior
      # (`apppass`) esta no historico desde 25/jul, commit c91b985 -- rotacionar
      # nao apaga o passado, so torna o passado inutil. Enquanto ele vivia neste
      # arquivo, o DATABASE_URL cifrado com SOPS ao lado nao protegia nada: a
      # mesma senha estava em claro a dez linhas de distancia.
      #
      # O usuario `app` fica: nao e segredo, ja nao e o `postgres` padrao, e
      # troca-lo obrigaria a mexer nos OWNER do initdb e em todo DATABASE_URL
      # sem ganho de seguranca.
      existingSecret: postgres-prod-auth
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
    image:
      registry: docker.io
      repository: bitnami/postgresql
      # `latest` porque as tags versionadas da bitnami já saíram do Docker Hub
      # (bitnami/postgresql:15 e :16 dão 404; só `latest` ainda resolve — mesma
      # retirada que matou o bitnami/kafka). O chart força imagePullPolicy:
      # IfNotPresent e o nó já tem esse `latest` em cache no digest
      # sha256:db2312d9... = PostgreSQL 16.4.0, que é o que o qa roda. Como é
      # nó único, o prod reaproveita a mesma imagem e as duas versões batem.
      # Se o cache do nó for limpo, `latest` pode vir com outro major — nesse
      # dia, pinar por digest antes de subir.
      tag: latest
    primary:
      replicaCount: 1
      persistence:
        size: 8Gi
      # A policy que o chart cria por padrao tem `ingress: ports: [5432]` e
      # NENHUM `from:` -- restringe a porta, nao a origem, entao qualquer pod de
      # qualquer namespace alcanca o banco. Com allowExternal: false o chart
      # passa a exigir, no pod cliente, o label
      # `postgres-prod-postgresql-client: "true"` (adicionado ao norteia-backend
      # via patch no kustomization deste overlay).
      #
      # podSelector sozinho vale so no mesmo namespace, entao o pgadmin (que
      # roda em `tools`) precisa da excecao por namespace abaixo -- sem ela o
      # restore pelo navegador para de funcionar. O label
      # kubernetes.io/metadata.name e posto pelo proprio Kubernetes em todo
      # namespace, nao depende de ninguem ter rotulado nada.
      networkPolicy:
        enabled: true
        allowExternal: false
        ingressNSMatchLabels:
          kubernetes.io/metadata.name: tools
        ingressNSPodMatchLabels:
          app: pgadmin
      # Sem isto o Postgres de prod competia sem teto com o resto do nó
      # (1 vCPU / 4 GB, compartilhado com o stack Compose). Mesmos valores
      # do qa, que roda com folga nessa faixa.
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
      initdb:
        scripts:
          01-extra-databases.sql: |
            CREATE DATABASE blueprint_auth OWNER app;
            CREATE DATABASE norteiadb OWNER app;
            CREATE DATABASE guiadb OWNER app;
            CREATE DATABASE n8ndb OWNER app;
