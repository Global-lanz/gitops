apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kafka-prod
  namespace: prod
spec:
  interval: 5m
  chart:
    spec:
      chart: kafka
      version: "28.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    replicaCount: 3
    zookeeper:
      enabled: true
    persistence:
      size: 8Gi
