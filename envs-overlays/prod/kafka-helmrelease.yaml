apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kafka-prod
  namespace: prod
spec:
  interval: 5m
  chart:
    spec:
      chart: kafka
      version: "28.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    kraft:
      enabled: false
    zookeeper:
      enabled: true
      image:
        tag: latest
    controller:
      replicaCount: 0
    broker:
      replicaCount: 3
    image:
      tag: latest
    persistence:
      size: 8Gi
