# Aggregates every app + per-env infra for `prod` into one path, so a single
# Flux Kustomization (flux/flux-kustomization-prod.yaml) can sync the whole
# environment. Toggling `prod` on/off = adding/removing that Flux Kustomization.

# Todo objeto deste overlay pertence ao prod. Os overlays de app ja declaravam
# `namespace: prod` cada um por si, mas o postgres-secret.enc.yaml nao declara
# namespace nenhum (o sops-campo.ps1 escreve so metadata.name) -- e nem o Flux
# Kustomization de prod usa targetNamespace. Sem esta linha o Secret ia parar
# no `default` e o StatefulSet do Postgres jamais o acharia, falhando com o
# secret "ausente" enquanto ele existia, no lugar errado.
namespace: prod

resources:
  - namespace.yaml
  - ../../apps/blueprint/overlays/prod
  - ../../apps/blueprint-auth/overlays/prod
  - ../../apps/norteia/overlays/prod
  - ../../apps/guia/overlays/prod
  - ../../apps/n8n/overlays/prod
  - postgres-helmrelease.yaml
  - postgres-secret.enc.yaml

  # kafka-helmrelease.yaml desabilitado — mesma razão do qa: as imagens
  # bitnami/kafka e bitnami/zookeeper não são mais publicadas no Docker Hub
  # (até a tag `latest` dá 404), então isso só rende ImagePullBackOff. Nada
  # em prod consome Kafka hoje (o astra decidiu não usar no MVP).
  # - kafka-helmrelease.yaml

# Só o norteia sobe em prod. O resto fica em 0 pelo mesmo motivo do qa: o nó
# é 1 vCPU / 4 GB, já está com ~58% de CPU requisitada e divide a máquina com
# o stack Docker Compose de produção. Ligar o Flux de prod com todos esses
# apps em 1 réplica é o que derruba o host, não o norteia sozinho.
#
# Ordem importa na hora de mexer aqui: subir um destes pra 1 é uma decisão de
# capacidade, não de configuração — medir antes (`kubectl describe node`).
replicas:
  - name: blueprint-backend
    count: 0
  - name: blueprint-frontend
    count: 0
  - name: blueprint-auth
    count: 0
  - name: blueprint-auth-frontend
    count: 0
  - name: guia-backend
    count: 0
  - name: guia-frontend
    count: 0
  - name: norteia-backend
    count: 1
  - name: norteia-frontend
    count: 1
  - name: n8n
    count: 0
  - name: n8n-worker
    count: 0
  - name: redis
    count: 0
