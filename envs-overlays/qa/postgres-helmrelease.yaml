apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-qa
  namespace: qa
spec:
  interval: 5m
  chart:
    spec:
      chart: postgresql
      version: "15.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    auth:
      username: app
      password: apppass
      database: blueprint-qa
    image:
      registry: docker.io
      repository: bitnami/postgresql
      tag: latest
    primary:
      replicaCount: 1
      persistence:
        size: 8Gi
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
      initdb:
        scripts:
          01-extra-databases.sql: |
            CREATE DATABASE blueprint_auth OWNER app;
            CREATE DATABASE norteiadb OWNER app;
            CREATE DATABASE guiadb OWNER app;
            CREATE DATABASE n8ndb OWNER app;
