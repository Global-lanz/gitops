creation_rules:
  # Secrets de infraestrutura por ambiente (ex: a senha do Postgres, que saiu
  # do values em claro do HelmRelease). Sem esta regra o sops recusa cifrar
  # qualquer coisa fora de apps/ com "no matching creation rules found".
  - path_regex: envs-overlays[\\/].*[\\/].*\.enc\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age1wtz65skfru6g47f6ygwtqfkczfn3h8wtz0kxwzv2r5saud8jyvuq085z05
  - path_regex: apps[\\/].*[\\/]overlays[\\/].*[\\/]secret\.enc\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age1wtz65skfru6g47f6ygwtqfkczfn3h8wtz0kxwzv2r5saud8jyvuq085z05
  - path_regex: apps[\\/].*[\\/]secret\.enc\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age1wtz65skfru6g47f6ygwtqfkczfn3h8wtz0kxwzv2r5saud8jyvuq085z05
