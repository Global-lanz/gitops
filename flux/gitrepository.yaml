apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gitops
  namespace: flux-system
spec:
  # A git fetch a minute, forever, on a host with no CPU to spare. Nothing here
  # changes that often, and a push that needs to land now can be pulled with
  # `flux reconcile source git gitops`.
  interval: 5m
  url: https://github.com/Global-lanz/gitops.git
  ref:
    branch: main
  secretRef:
    name: git-repo-secret
